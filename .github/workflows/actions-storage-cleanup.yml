name: Actions Storage Cleanup

on:
  push:
    branches:
      - feature/design-intelligence
    paths:
      - ".github/workflows/actions-storage-cleanup.yml"
  workflow_dispatch:
    inputs:
      clear_all_caches:
        description: "Delete all GitHub Actions caches for this repository"
        required: true
        default: true
        type: boolean

permissions:
  actions: write
  contents: read

concurrency:
  group: actions-storage-cleanup-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cleanup:
    name: Remove disposable test artifacts and Actions caches
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Allow branch CI runs to finish first
        if: github.event_name == 'push'
        run: sleep 480

      - name: Delete disposable test artifacts and optionally all caches
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const artifactPattern = /(test|browser-evidence|playwright|screenshot|coverage|junit|test-results|test-report)/i;
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner, repo, per_page: 100 }
            );

            let deletedArtifacts = 0;
            let keptArtifacts = 0;
            for (const artifact of artifacts) {
              if (artifactPattern.test(artifact.name)) {
                await github.rest.actions.deleteArtifact({
                  owner, repo, artifact_id: artifact.id
                });
                core.info(`Deleted disposable artifact: ${artifact.name} (${artifact.size_in_bytes} bytes)`);
                deletedArtifacts++;
              } else {
                core.info(`Kept non-test artifact: ${artifact.name}`);
                keptArtifacts++;
              }
            }

            const clearAllCaches =
              context.eventName === 'push' ||
              (context.payload.inputs?.clear_all_caches ?? 'true') === true ||
              (context.payload.inputs?.clear_all_caches ?? 'true') === 'true';

            let deletedCaches = 0;
            let reclaimedCacheBytes = 0;
            if (clearAllCaches) {
              const caches = await github.paginate(
                github.rest.actions.getActionsCacheList,
                { owner, repo, per_page: 100 }
              );
              for (const cache of caches) {
                await github.rest.actions.deleteActionsCacheById({
                  owner, repo, cache_id: cache.id
                });
                deletedCaches++;
                reclaimedCacheBytes += cache.size_in_bytes || 0;
                core.info(`Deleted Actions cache: ${cache.key} (${cache.size_in_bytes || 0} bytes)`);
              }
            } else {
              core.info('Cache deletion skipped by workflow input.');
            }

            core.notice(
              `Cleanup complete: deleted ${deletedArtifacts} disposable test artifacts; kept ${keptArtifacts} other artifacts; deleted ${deletedCaches} caches (~${reclaimedCacheBytes} bytes).`
            );
            core.summary
              .addHeading('GitHub Actions storage cleanup')
              .addTable([
                [{data:'Item',header:true},{data:'Result',header:true}],
                ['Disposable test artifacts deleted', String(deletedArtifacts)],
                ['Other artifacts preserved', String(keptArtifacts)],
                ['Actions caches deleted', String(deletedCaches)],
                ['Approximate cache bytes reclaimed', String(reclaimedCacheBytes)],
                ['Repository source/test files', 'Not modified']
              ])
              .addQuote('Only stored Actions artifacts matching test/evidence naming patterns are deleted. Repository files, workflow runs, logs, releases, and non-test artifacts are preserved.')
              .write();
