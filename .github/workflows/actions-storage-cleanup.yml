name: Actions Storage Cleanup

on:
  push:
    branches:
      - feature/design-intelligence
    paths:
      - ".github/workflows/actions-storage-cleanup.yml"
      - ".github/workflows/design-intelligence-build.yml"
  workflow_dispatch:
    inputs:
      clear_all_caches:
        description: "Delete all GitHub Actions caches for this repository"
        required: true
        default: true
        type: boolean
      delete_completed_test_runs:
        description: "Delete completed Design Intelligence Build Check run logs on this branch"
        required: true
        default: true
        type: boolean

permissions:
  actions: write
  contents: read

concurrency:
  group: actions-storage-cleanup-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cleanup:
    name: Clean Actions storage (artifacts, caches and old test logs)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Delete disposable test artifacts, caches and completed test run logs
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const inputs = context.payload.inputs || {};
            const artifactPattern = /(test|browser-evidence|playwright|screenshot|coverage|junit|test-results|test-report)/i;

            // Remove only stored artifacts whose names indicate temporary test evidence.
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner, repo, per_page: 100 }
            );
            let deletedArtifacts = 0;
            let keptArtifacts = 0;
            for (const artifact of artifacts) {
              if (artifactPattern.test(artifact.name)) {
                await github.rest.actions.deleteArtifact({
                  owner, repo, artifact_id: artifact.id
                });
                core.info(`Deleted disposable artifact: ${artifact.name} (${artifact.size_in_bytes} bytes)`);
                deletedArtifacts++;
              } else {
                core.info(`Preserved artifact not classified as test evidence: ${artifact.name}`);
                keptArtifacts++;
              }
            }

            const clearAllCaches =
              context.eventName === 'push' ||
              String(inputs.clear_all_caches ?? 'true') === 'true';
            let deletedCaches = 0;
            let reclaimedCacheBytes = 0;
            if (clearAllCaches) {
              const caches = await github.paginate(
                github.rest.actions.getActionsCacheList,
                { owner, repo, per_page: 100 }
              );
              for (const cache of caches) {
                await github.rest.actions.deleteActionsCacheById({
                  owner, repo, cache_id: cache.id
                });
                deletedCaches++;
                reclaimedCacheBytes += cache.size_in_bytes || 0;
                core.info(`Deleted Actions cache: ${cache.key} (${cache.size_in_bytes || 0} bytes)`);
              }
            }

            // Workflow files are deliberately preserved. Delete only completed run records/logs
            // for the DI build/test workflow on this feature branch; never touch active runs or main.
            const deleteTestRuns =
              context.eventName === 'push' ||
              String(inputs.delete_completed_test_runs ?? 'true') === 'true';
            let deletedTestRuns = 0;
            let preservedActiveTestRuns = 0;
            if (deleteTestRuns) {
              const runs = await github.paginate(
                github.rest.actions.listWorkflowRunsForRepo,
                {
                  owner, repo,
                  branch: 'feature/design-intelligence',
                  per_page: 100
                }
              );
              for (const run of runs) {
                if (run.name === 'Design Intelligence Build Check' && run.status === 'completed') {
                  await github.rest.actions.deleteWorkflowRun({
                    owner, repo, run_id: run.id
                  });
                  deletedTestRuns++;
                  core.info(`Deleted completed DI test/build run logs: ${run.id} (${run.conclusion || 'no conclusion'})`);
                } else if (run.name === 'Design Intelligence Build Check') {
                  preservedActiveTestRuns++;
                }
              }
            }

            core.notice(
              `Cleanup finished. Test artifacts deleted: ${deletedArtifacts}; other artifacts preserved: ${keptArtifacts}; caches deleted: ${deletedCaches}; completed DI test/build run records deleted: ${deletedTestRuns}; active DI runs preserved: ${preservedActiveTestRuns}; estimated cache bytes reclaimed: ${reclaimedCacheBytes}.`
            );
            core.summary
              .addHeading('GitHub Actions storage cleanup')
              .addTable([
                [{data:'Item',header:true},{data:'Result',header:true}],
                ['Disposable test artifacts deleted', String(deletedArtifacts)],
                ['Other artifacts preserved', String(keptArtifacts)],
                ['Actions caches deleted', String(deletedCaches)],
                ['Completed DI build/test run logs deleted (feature branch only)', String(deletedTestRuns)],
                ['Active DI build/test runs preserved', String(preservedActiveTestRuns)],
                ['Approximate cache bytes reclaimed', String(reclaimedCacheBytes)],
                ['Workflow YAML and repository files', 'Preserved']
              ])
              .addQuote('This removes stored Actions artifacts, caches, and completed test/build run records. It does not delete workflow definitions or application/test source files.')
              .write();
