name: Design Intelligence Build Check

on:
  push:
    branches:
      - feature/design-intelligence
      - main
  pull_request:
    branches:
      - feature/design-intelligence
      - main
    paths:
      - "src/pages/DesignIntelligence/**"
      - "src/App.jsx"
      - "src/components/Navbar/Navbar.jsx"
      - "package.json"
      - "package-lock.json"
      - "vite.config.*"
      - ".github/workflows/design-intelligence-build.yml"
      - "api/**"
      - "scripts/di-cashfree-contract.mjs"
      - "scripts/di-entitlement-contract.mjs"

concurrency:
  group: design-intelligence-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        env:
          VITE_FIREBASE_API_KEY: "AIzaSyAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
          VITE_FIREBASE_AUTH_DOMAIN: "ci-browser-test.invalid"
          VITE_FIREBASE_PROJECT_ID: "ci-browser-test"
          VITE_FIREBASE_STORAGE_BUCKET: "ci-browser-test.appspot.com"
          VITE_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
          VITE_FIREBASE_APP_ID: "1:000000000000:web:ci-browser-test"
          VITE_CI_ADMIN_EMAIL: "ci-admin@example.invalid"
          VITE_ADMIN_EMAIL: "ci-admin@example.invalid"
        run: npm run build -- --mode ci

      - name: Verify Cashfree server order contract
        run: node scripts/di-cashfree-contract.mjs

      - name: Verify OpenAI BYOK model registry
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q "o1-preview\|o1-mini" src/ai/providers/AIProviderContext.jsx
          ! grep -q "gpt-5.6-terra\|gpt-5.6-luna" src/ai/providers/AIProviderContext.jsx
          grep -q "gpt-6-astra" src/ai/providers/AIProviderContext.jsx
          grep -q "gpt-6-sol" src/ai/providers/AIProviderContext.jsx
          grep -q "gpt-6-luna" src/ai/providers/AIProviderContext.jsx
          grep -q "gpt-5.6-sol" src/ai/providers/AIProviderContext.jsx
          grep -q "gpt-5.6-cyber" src/ai/providers/AIProviderContext.jsx
          echo "OpenAI BYOK model registry: current GPT-6 suggestions + current GPT-5.6 specialized models present; retired IDs absent"

      - name: Verify Firebase entitlement and protected catalog boundary
        run: node scripts/di-entitlement-contract.mjs

      - name: Verify shared Ultra Premium+ price contract
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module -e "import { ULTRA_PREMIUM_PRICE_INR as UI_PRICE } from './src/pages/DesignIntelligence/access.js'; import { ULTRA_PREMIUM_PRICE_INR as SERVER_PRICE } from './api/_lib/cashfree.js'; if (UI_PRICE !== 200 || SERVER_PRICE !== 200 || UI_PRICE !== SERVER_PRICE) throw new Error('Ultra Premium+ price contract mismatch'); console.log('Ultra Premium+ price contract: ₹200')"

      - name: Verify canonical npm package tarball and local installation
        shell: bash
        run: |
          set -euo pipefail
          cd src/pages/DesignIntelligence
          npm pack --dry-run --json > /tmp/di-pack-dry-run.json
          npm pack --json > /tmp/di-pack.json
          TARBALL="$(node --input-type=commonjs -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('/tmp/di-pack.json','utf8')); process.stdout.write(x[0].filename)")"
          test -f "$TARBALL"
          cd /tmp
          rm -rf motionzync-di-npm-install
          mkdir motionzync-di-npm-install
          cd motionzync-di-npm-install
          npm init -y >/dev/null 2>&1
          npm install "$GITHUB_WORKSPACE/src/pages/DesignIntelligence/$TARBALL" --no-audit --no-fund
          node --input-type=module -e "const di=await import('@motionzync/design-intelligence'); if(typeof di.buildRecipe!=='function'||typeof di.searchCatalog!=='function'||typeof di.createRemoteKnowledgeClient!=='function'||typeof di.createSpecialEffectsClient!=='function') throw new Error('Canonical npm exports are incomplete'); if(!Array.isArray(di.DI_STYLES)||di.DI_STYLES.length===0) throw new Error('Canonical catalog is empty'); console.log('NPM package install smoke passed')"

      - name: Verify published npm registry installation
        shell: bash
        run: |
          set -euo pipefail
          mkdir published-motionzync-di-consumer
          cd published-motionzync-di-consumer
          npm init -y >/dev/null 2>&1
          npm install @motionzync/design-intelligence@0.1.0 --registry=https://registry.npmjs.org --no-audit --no-fund
          node --input-type=module -e "const di=await import('@motionzync/design-intelligence'); if(di.DESIGN_INTELLIGENCE_NPM_VERSION!=='0.1.0') throw new Error('Published npm version mismatch'); if(typeof di.buildRecipe!=='function'||typeof di.searchCatalog!=='function'||typeof di.createRemoteKnowledgeClient!=='function'||typeof di.createSpecialEffectsClient!=='function') throw new Error('Published npm exports are incomplete'); if(!Array.isArray(di.DI_STYLES)||di.DI_STYLES.length===0) throw new Error('Published npm catalog is empty'); console.log('Published npm registry install/import smoke passed')"

      - name: Install CI browser and accessibility tooling
        run: npm install --no-save --no-audit --no-fund playwright@1.55.0 @axe-core/playwright@4.10.2 axe-core@4.10.2

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start production Vite preview
        shell: bash
        env:
          VITE_FIREBASE_API_KEY: "AIzaSyAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
          VITE_FIREBASE_AUTH_DOMAIN: "ci-browser-test.invalid"
          VITE_FIREBASE_PROJECT_ID: "ci-browser-test"
          VITE_FIREBASE_STORAGE_BUCKET: "ci-browser-test.appspot.com"
          VITE_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
          VITE_FIREBASE_APP_ID: "1:000000000000:web:ci-browser-test"
          VITE_CI_ADMIN_EMAIL: "ci-admin@example.invalid"
          VITE_ADMIN_EMAIL: "ci-admin@example.invalid"
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/motionzync-di-vite.log 2>&1 &
          echo $! > /tmp/motionzync-di-vite.pid
          for attempt in {1..30}; do
            if curl --silent --show-error --fail http://127.0.0.1:4173/design-intelligence >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/motionzync-di-vite.log
          exit 1

      - name: Browser route, interaction and responsive smoke test
        shell: bash
        run: |
          mkdir -p /tmp/di-browser-artifacts
          node --input-type=module <<'EOF'
          import { chromium } from 'playwright'
          import AxeBuilder from '@axe-core/playwright'

          const base = 'http://127.0.0.1:4173'
          const routes = [
            '/design-intelligence',
            '/design-intelligence/explorer',
            '/design-intelligence/ui-gallery',
            '/design-intelligence/generator',
            '/design-intelligence/knowledge',
            '/design-intelligence/stacks',
            '/design-intelligence/docs',
            '/design-intelligence/pricing',
          ]

          const browser = await chromium.launch({headless:true})
          const context = await browser.newContext({viewport:{width:1440,height:900},permissions:['clipboard-read','clipboard-write']})
          const page = await context.newPage()
          await page.addInitScript(() => {
            window.__motionzyncCashfreeCalls = []
            window.Cashfree = ({mode}) => ({
              checkout: async options => {
                window.__motionzyncCashfreeCalls.push({mode, ...options})
                return {}
              },
            })
          })
          // External AdSense measurement scripts are not part of DI UI behavior and
          // can throw transient third-party errors; block them in isolated CI only.
          await page.route('**/pagead2.googlesyndication.com/**', route => route.abort())
          await page.route('**/googleads.g.doubleclick.net/**', route => route.abort())
          await page.route('**/identitytoolkit.googleapis.com/**', async route => {
            const url = route.request().url()
            if (url.includes('/accounts:lookup')) {
              await route.fulfill({
                status: 200,
                contentType: 'application/json',
                body: JSON.stringify({ users: [] }),
              })
              return
            }
            await route.continue()
          })
          await page.addInitScript(() => {
            window.__motionzyncAccessPolicySaves = []
            const originalFetch = window.fetch.bind(window)
            window.fetch = async (input, init) => {
              const url = typeof input === 'string' ? input : input.url
              if (url.endsWith('/api/di-knowledge')) {
                // Deterministic CI-only fixture: this is not real Firebase or production entitlement verification.
                return new Response(JSON.stringify({
                  ok:true,
                  entitlement:{
                    tier:'premium',
                    contentTier:'premium',
                    authenticated:true,
                    protectedIncluded:true,
                    ultraContentIncluded:false,
                    contentAccessReason:'ci-premium-fixture',
                    festivalOfferActive:false,
                  },
                  records:[],
                  counts:{},
                }), {status:200,headers:{'Content-Type':'application/json'}})
              }
              if (url.endsWith('/api/admin-billing')) {
                const method = init?.method || (typeof input !== 'string' ? input.method : 'GET')
                const requestBody = method === 'POST' ? JSON.parse(init?.body || '{}') : {}
                const payload = method === 'POST' && requestBody.action === 'saveDesignIntelligenceAccessPolicy'
                  ? {
                      ok:true,
                      accessPolicy:requestBody.accessPolicy,
                      accessPolicyState:{policy:requestBody.accessPolicy,festivalOfferActive:false,premiumCanAccessUltraContent:requestBody.accessPolicy.shareUltraWithPremium || requestBody.accessPolicy.festivalOffer?.enabled === true,timezone:'Asia/Kolkata'},
                    }
                  : method === 'POST'
                    ? {result:{email:'ci-admin@example.invalid',tier:'premium'}}
                    : {
                      summary:{uniquePayers:0,successfulPayments:0,grossRevenue:0,refundedAmount:0,activeEntitlements:0,activeApiKeys:0,manualGrants:0,totalPaymentRecords:0},
                      paymentStatus:[],planDistribution:[],entitlementSources:[],apiKeyStatus:[],monthly:[],recentTransactions:[],
                      generatedAt:new Date().toISOString(),
                      limits:{collectionsReadLimit:10000,recentTransactions:100},
                      accessPolicy:{shareUltraWithPremium:true,festivalOffer:{enabled:false,startDate:'',startTime:'',endDate:'',endTime:'',timezone:'Asia/Kolkata'}},
                      accessPolicyState:{festivalOfferActive:false,premiumCanAccessUltraContent:true,timezone:'Asia/Kolkata'},
                    }
                if(method==='POST' && requestBody.action==='saveDesignIntelligenceAccessPolicy'){
                  window.__motionzyncAccessPolicySaves.push(requestBody.accessPolicy)
                }
                return new Response(JSON.stringify(payload), {status:200,headers:{'Content-Type':'application/json'}})
              }
              if (url.endsWith('/api/cashfree-create-order')) {
                window.__motionzyncCashfreeOrderBody = init?.body || null
                return new Response(JSON.stringify({
                  paymentSessionId:'ci-payment-session',
                  environment:'sandbox',
                  plan:'ultra-premium',
                  amount:200,
                  orderId:'ci-order',
                }), {status:200,headers:{'Content-Type':'application/json'}})
              }
              return originalFetch(input, init)
            }
          })
          const failures = []

          page.on('pageerror', error => {
            const stack = String(error.stack || '')
            // Google AdSense RUM can emit transient uncaught errors even when its network requests are blocked.
            // Ignore only exceptions originating from that external script; first-party page errors still fail CI.
            if (stack.includes('pagead2.googlesyndication.com')) return
            failures.push('pageerror: '+error.message+' | url='+page.url()+' | stack='+stack.slice(0,1200))
          })
          page.on('console', message => {
            if (message.type() !== 'error') return
            const text = message.text()
            if (/Refused to frame 'https:\/\/www\.google\.com\/' because an ancestor violates.*frame-ancestors|Failed to load resource: net::ERR_FAILED/i.test(text)) return
            failures.push('console.error: '+text)
          })

          const assert = (condition, message) => {
            if (!condition) throw new Error(message)
          }

          const checkAccessibleNames = async () => page.evaluate(() => {
            const problems = []
            for (const element of document.querySelectorAll('button,a,input,textarea,select')) {
              const style = getComputedStyle(element)
              if (style.display === 'none' || style.visibility === 'hidden') continue
              const labelledBy = element.getAttribute('aria-labelledby')
              const ariaLabel = element.getAttribute('aria-label')
              const text = (element.textContent || '').trim()
              const placeholder = element.getAttribute('placeholder') || ''
              if (!ariaLabel && !labelledBy && !text && !placeholder) {
                problems.push(element.outerHTML.slice(0,160))
              }
              if (element.matches('input,textarea,select') && !ariaLabel && !labelledBy) {
                const id = element.getAttribute('id')
                const label = id ? document.querySelector(`label[for="${CSS.escape(id)}"]`) : null
                if (!label) problems.push('unlabelled-form-control: '+element.outerHTML.slice(0,160))
              }
            }
            return problems
          })

          const analyzeAxeStable = async route => {
            let lastError = null
            for (let attempt = 1; attempt <= 3; attempt++) {
              try {
                await page.locator('.di-shell').waitFor({state:'visible'})
                await page.waitForTimeout(350)
                return await new AxeBuilder({page}).include('.di-shell').analyze()
              } catch (error) {
                lastError = error
                if (!/Execution context was destroyed|navigation|Target page, context or browser has been closed/i.test(String(error?.message || error)) || attempt === 3) {
                  throw error
                }
                await page.goto(base + route, {waitUntil:'domcontentloaded'})
                await page.locator('.di-shell').waitFor({state:'visible'})
              }
            }
            throw lastError
          }

          for (const route of routes) {
            await page.goto(base + route, {waitUntil:'domcontentloaded'})
            await page.locator('.di-shell').waitFor({state:'visible'})
            await page.waitForTimeout(350)
            const text = await page.locator('body').innerText()
            const shellCount = await page.locator('.di-shell').count()
            assert(!text.includes('₹200'), route+' leaked the deferred payment price into public UI')
            assert(
              shellCount === 1,
              route+' did not mount the Design Intelligence shell. url='+await page.url()+' body='+JSON.stringify(text.slice(0,1200))+' errors='+JSON.stringify(failures)
            )

            const accessibilityProblems = await checkAccessibleNames()
            assert(accessibilityProblems.length === 0, route+' accessibility-name issues: '+JSON.stringify(accessibilityProblems))

            const axeResults = await analyzeAxeStable(route)
            const seriousViolations = axeResults.violations.filter(violation => ['critical','serious'].includes(violation.impact))
            assert(
              seriousViolations.length === 0,
              route+' serious/critical axe violations: '+JSON.stringify(seriousViolations.map(({id,impact,help,nodes})=>({id,impact,help,nodes:nodes.map(node=>node.target)})))
            )

            await page.screenshot({
              path:'/tmp/di-browser-artifacts/'+route.split('/').filter(Boolean).join('-')+'.png',
              fullPage:true,
            })

            if (route.endsWith('/ui-gallery')) {
              assert(text.includes('Browse 3,600 UI designs'), 'UI Gallery headline is missing')
              assert(text.includes('3,600 manifest entries across 18 categories'), 'UI Gallery manifest totals are not shown')
              assert((await page.locator('.dib-design-card').count()) === 120, 'UI Gallery should initially render at most 120 cards')

              const categorySelect = page.locator('.dib-filter-row select').nth(0)
              const tierSelect = page.locator('.dib-filter-row select').nth(1)
              assert((await categorySelect.locator('option').count()) === 19, 'UI Gallery should expose 18 categories plus All categories')
              await categorySelect.selectOption({index:1})
              await tierSelect.selectOption('premium')
              await page.getByText('100 matching designs', {exact:false}).waitFor()
              assert((await page.locator('.dib-design-card').count()) === 100, 'Category + Premium filters should expose the 100 matching design records')

              const searchableName = await page.locator('.dib-design-card strong').first().innerText()
              await page.locator('#dib-search').fill(searchableName)
              assert((await page.locator('.dib-design-card').count()) >= 1, 'UI Gallery name search returned no matching design')

              await page.locator('.dib-preview-placeholder button').click()
              await page.locator('.dib-rendered-preview').waitFor({state:'visible',timeout:30000})
              assert((await page.locator('.dib-rendered-preview').getAttribute('data-theme')) === 'light', 'UI Gallery initial theme is not light')
              const lightSurface = await page.locator('.dib-rendered-preview').evaluate(element => getComputedStyle(element).getPropertyValue('--mz-surface').trim())
              assert(lightSurface === '#ffffff', 'UI Gallery light theme tokens were not applied: '+lightSurface)
              const themeSurfaceTokens = {light:'#ffffff',dark:'#12141a',colorful:'#fffaf3','high-contrast':'#000'}
              const readSurfaceToken = () => page.locator('.dib-rendered-preview').evaluate(element => getComputedStyle(element).getPropertyValue('--mz-surface').trim())
              assert((await readSurfaceToken()) === themeSurfaceTokens.light, 'UI Gallery light theme surface token was not applied')
              for (const theme of ['Dark','Colorful','High contrast']) {
                await page.getByRole('button', {name:theme, exact:true}).click()
                const expected = theme === 'High contrast' ? 'high-contrast' : theme.toLowerCase()
                assert((await page.locator('.dib-rendered-preview').getAttribute('data-theme')) === expected, 'UI Gallery theme did not apply: '+expected)
                const expectedSurface = {'Dark':'#12141a','Colorful':'#fffaf3','High contrast':'#000'}[theme]
                const surface = await page.locator('.dib-rendered-preview').evaluate(element => getComputedStyle(element).getPropertyValue('--mz-surface').trim())
                assert(surface === expectedSurface, 'UI Gallery computed theme token mismatch for '+expected+': '+surface)
                assert((await readSurfaceToken()) === themeSurfaceTokens[expected], 'UI Gallery theme surface token did not apply: '+expected)
              }

              await page.locator('#dib-search').fill('')
              await tierSelect.selectOption('ultra-premium')
              await page.getByText('Preview locked', {exact:true}).waitFor()
              assert((await page.locator('.dib-preview-placeholder button').count()) === 0, 'Premium CI fixture unexpectedly unlocked an Ultra Premium+ preview')
            }

            if (route.endsWith('/explorer')) {
              await page.locator('#di-search').fill('healthcare')
              assert((await page.locator('.di-record').count()) > 0, 'Explorer search did not produce a healthcare result')
              const simpleTier = page.getByRole('button', {name:'Simple / Free', exact:true})
              await simpleTier.click()
              assert((await simpleTier.getAttribute('aria-pressed')) === 'true', 'Explorer simple/free tier filter did not expose selected state')
              assert((await page.locator('.di-record').count()) > 0, 'Free-tier filtering unexpectedly hid all local Free designs')
              const allTiers = page.getByRole('button', {name:'All tiers', exact:true})
              await allTiers.click()
              assert((await allTiers.getAttribute('aria-pressed')) === 'true', 'Explorer All tiers filter did not reset selected state')
              const stylesChip = page.getByRole('button', {name:'Styles', exact:true})
              await stylesChip.click()
              assert((await stylesChip.getAttribute('aria-pressed')) === 'true', 'Explorer domain button did not expose selected state')
            }

            if (route.endsWith('/generator')) {
              await page.getByRole('button', {name:/Generate deterministic recipe/}).click()
              assert((await page.locator('.di-preview').count()) === 1, 'Generator preview did not render')
              const customize = page.locator('.di-customize')
              await customize.locator('summary').click()
              await page.locator('#di-choice-style').selectOption({label:'Bento'})
              assert((await page.locator('.di-recipe-grid h2').innerText()).includes('Bento'), 'Manual style override did not update the validated recipe')
              await page.locator('#di-choice-palette').selectOption({label:'Violet + Indigo'})
              assert((await page.locator('.di-recipe-grid h2').innerText()).includes('Violet + Indigo'), 'Manual palette override did not update the validated recipe')
              await page.getByRole('button', {name:'Reset recipe choices'}).click()
              assert((await page.locator('#di-choice-style').inputValue()) === '', 'Reset did not restore generated style choice')
              assert((await page.locator('#di-choice-palette').inputValue()) === '', 'Reset did not restore generated palette choice')
              const previewControls = page.getByRole('group', {name:'Responsive preview size'})
              assert((await previewControls.getByRole('button').count()) === 3, 'Generator should expose Desktop, Tablet and Mobile preview controls')
              const mobilePreview = previewControls.getByRole('button', {name:'Mobile', exact:true})
              await mobilePreview.click()
              assert((await mobilePreview.getAttribute('aria-pressed')) === 'true', 'Mobile preview button did not expose selected state')
              assert((await page.locator('.di-preview').getAttribute('class')).includes('di-preview-viewport-mobile'), 'Mobile preview did not update the preview layout')
              assert((await page.locator('.di-preview-caption').innerText()).includes('Mobile layout simulation'), 'Mobile preview state caption is missing')
              const tabletPreview = previewControls.getByRole('button', {name:'Tablet', exact:true})
              await tabletPreview.click()
              assert((await page.locator('.di-preview').getAttribute('class')).includes('di-preview-viewport-tablet'), 'Tablet preview did not update the preview layout')
              const desktopPreview = previewControls.getByRole('button', {name:'Desktop', exact:true})
              await desktopPreview.click()
              assert((await page.locator('.di-preview').getAttribute('class')).includes('di-preview-viewport-desktop'), 'Desktop preview did not update the preview layout')

              const aiToggle = page.getByRole('button', {name:/Enable AI-assisted refinement|AI-assisted mode enabled/})
              await aiToggle.waitFor()
              assert((await aiToggle.getAttribute('aria-pressed')) === 'false', 'AI toggle initial state was not exposed')
              await aiToggle.click()
              assert((await aiToggle.getAttribute('aria-pressed')) === 'true', 'AI toggle did not expose pressed state')
            }

            if (route === '/design-intelligence/pricing') {
              assert((await page.getByText(/Signed in as ci-admin@example\.invalid\./).count()) === 1, 'Pricing CI authenticated identity state is missing')
              assert((await page.getByText('Payment launch pending', {exact:true}).count()) >= 1, 'Payment pending UI is missing')
              assert((await page.getByText('Payment integration is temporarily pending.', {exact:false}).count()) >= 1, 'Payment pending explanation is missing')
              assert((await page.getByText('₹200', {exact:false}).count()) === 0, 'Temporarily hidden ₹200 price leaked into the public pricing UI')
              assert((await page.getByRole('button', {name:/Pay ₹200/}).count()) === 0, 'Temporarily disabled ₹200 checkout button is still visible')
            }
          }

          
          await page.goto(base+'/design-intelligence/docs', {waitUntil:'networkidle'})
          const copyButtons = page.getByRole('button', {name:'Copy command', exact:true})
          assert((await copyButtons.count()) === 2, 'Docs should expose Copy controls for both the npm command and developer example')
          await copyButtons.nth(0).click()
          await page.getByRole('button', {name:'Copied command', exact:true}).waitFor()
          await page.locator('.di-copy-status').filter({hasText:'Copied to clipboard.'}).waitFor()
          const installCommand = await page.evaluate(() => navigator.clipboard.readText())
          assert(installCommand === 'npm install @motionzync/design-intelligence', 'Copy control did not copy the exact npm installation command')
          await page.locator('.di-code-wrap .di-copy-btn').nth(1).click()
          await page.locator('.di-copy-status').filter({hasText:'Copied to clipboard.'}).last().waitFor()
          const exampleCommand = await page.evaluate(() => navigator.clipboard.readText())
          assert(exampleCommand.includes("searchCatalog('healthcare minimal', 'styles', 'free')"), 'Copy control omitted the developer search example')
          assert(exampleCommand.includes("buildRecipe('dark healthcare analytics dashboard', 'free')"), 'Copy control omitted the developer recipe example')

          await page.goto(base+'/admin', {waitUntil:'networkidle'})
          assert((await page.getByRole('button', {name:/DI Billing/}).count()) === 1, 'Admin DI Billing tab is missing')
          await page.getByRole('button', {name:/DI Billing/}).click()
          await page.getByRole('heading', {name:'Billing & entitlement analytics'}).waitFor()
          for (const heading of ['Payment status','Paid plan distribution','Entitlement sources','API key status','Monthly revenue','Payment / transaction records']) {
            assert((await page.getByRole('heading', {name:heading, exact:true}).count()) === 1, 'Admin billing chart/section missing: '+heading)
          }
          assert((await page.getByRole('textbox', {name:'Google account email'}).count()) === 1, 'Admin entitlement email field is missing')
          assert((await page.getByRole('combobox', {name:'Entitlement tier'}).count()) === 1, 'Admin entitlement tier field is missing')
          assert((await page.getByText('No payment records exist yet. This is not seeded/fake data.').count()) === 1, 'Admin billing empty-state is missing')
          await page.screenshot({path:'/tmp/di-browser-artifacts/admin-di-billing.png',fullPage:true})

          await page.getByRole('button', {name:/Settings/}).click()
          await page.getByRole('heading', {name:'Premium / Ultra Premium+ content settings'}).waitFor()
          const shareUltra = page.getByRole('checkbox', {name:/Allow logged-in Premium accounts to view Ultra Premium\+ designs/})
          assert(await shareUltra.isChecked(), 'Ultra design sharing should default to ON')
          const festivalOffer = page.getByRole('checkbox', {name:/Schedule a time-limited festival offer for Ultra designs/})
          assert(!(await festivalOffer.isChecked()), 'Festival offer should default to OFF')
          await page.locator('#di-offer-start-date').fill('2026-10-31')
          await page.locator('#di-offer-start-time').fill('10:00')
          await page.locator('#di-offer-end-date').fill('2026-11-01')
          await page.locator('#di-offer-end-time').fill('20:00')
          await festivalOffer.check()
          await page.getByRole('button', {name:'Save access settings'}).click()
          await page.getByText('Settings saved on the server. Access changes apply to new knowledge requests.', {exact:true}).waitFor()
          const savedPolicies = await page.evaluate(() => window.__motionzyncAccessPolicySaves)
          assert(savedPolicies.length === 1, 'Admin access policy did not call the protected server save action')
          assert(savedPolicies[0].shareUltraWithPremium === true, 'Admin access policy save unexpectedly disabled Ultra sharing')
          assert(savedPolicies[0].festivalOffer.enabled === true, 'Admin festival offer toggle was not persisted')
          assert(savedPolicies[0].festivalOffer.startDate === '2026-10-31' && savedPolicies[0].festivalOffer.endDate === '2026-11-01', 'Admin offer date window was not persisted')
          assert(savedPolicies[0].festivalOffer.startTime === '10:00' && savedPolicies[0].festivalOffer.endTime === '20:00', 'Admin offer time window was not persisted')
          await page.screenshot({path:'/tmp/di-browser-artifacts/admin-di-access-settings.png',fullPage:true})

          for (const viewport of [
            {width:390,height:844,name:'mobile'},
            {width:768,height:1024,name:'tablet'},
            {width:1440,height:900,name:'desktop'},
          ]) {
            await page.setViewportSize({width:viewport.width,height:viewport.height})
            await page.goto(base+'/design-intelligence/generator', {waitUntil:'networkidle'})
            const overflow = await page.evaluate(() => ({
              width: document.documentElement.scrollWidth,
              viewport: document.documentElement.clientWidth,
            }))
            assert(overflow.width <= overflow.viewport + 1, viewport.name+' horizontal overflow: '+JSON.stringify(overflow))
            await page.screenshot({
              path:'/tmp/di-browser-artifacts/generator-'+viewport.name+'.png',
              fullPage:true,
            })
            await page.goto(base+'/design-intelligence/ui-gallery', {waitUntil:'domcontentloaded'})
            await page.locator('.dib-page').waitFor({state:'visible'})
            const galleryOverflow = await page.evaluate(() => ({
              width: document.documentElement.scrollWidth,
              viewport: document.documentElement.clientWidth,
            }))
            assert(galleryOverflow.width <= galleryOverflow.viewport + 1, viewport.name+' UI Gallery horizontal overflow: '+JSON.stringify(galleryOverflow))
          }

          await page.setViewportSize({width:1440,height:900})
          await page.goto(base+'/admin', {waitUntil:'networkidle'})
          await page.getByRole('button', {name:/DI Billing/}).click()
          const adminOverflow = await page.evaluate(() => ({
            width: document.documentElement.scrollWidth,
            viewport: document.documentElement.clientWidth,
          }))
          assert(adminOverflow.width <= adminOverflow.viewport + 1, 'Admin billing horizontal overflow: '+JSON.stringify(adminOverflow))
          await page.goto(base+'/design-intelligence/explorer', {waitUntil:'networkidle'})
          await page.keyboard.press('Tab')
          const focusVisible = await page.evaluate(() => {
            const element = document.activeElement
            return !!element && element.matches(':focus-visible')
          })
          assert(focusVisible, 'Keyboard focus did not enter a :focus-visible state')

          if (failures.length) throw new Error(failures.join('\\n'))
          await browser.close()
          EOF

      - name: Upload browser screenshots and Vite log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: design-intelligence-browser-evidence
          path: |
            /tmp/di-browser-artifacts/
            /tmp/motionzync-di-vite.log
          if-no-files-found: ignore
